[project]
name = "lerobot-so101-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "lerobot[dataset,feetech,hardware]",
    "pyyaml>=6.0",
    "pyzmq>=25",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "lerobot",
]

[tool.uv.sources]
lerobot = { workspace = true }
